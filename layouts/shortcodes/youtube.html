{{- $id := .Get 0 -}}
{{- $title := .Get 1 | default "YouTube video" -}}
{{- $class := .Get "class" | default "" -}}
<div class="youtube-embed{{ with $class }} {{ . }}{{ end }}" data-yt-facade data-yt-id="{{ $id }}" data-yt-title="{{ $title }}">
  <button type="button" class="youtube-facade-btn" aria-label="Play video: {{ $title }}">
    <img class="youtube-facade-thumb"
         src="https://i.ytimg.com/vi/{{ $id }}/hqdefault.jpg"
         alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">
    <span class="youtube-facade-play" aria-hidden="true">
      <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <circle cx="34" cy="34" r="34" fill="#000" fill-opacity="0.5"/>
        <path d="M28 22l20 12-20 12z" fill="#fff"/>
      </svg>
    </span>
  </button>
</div>
