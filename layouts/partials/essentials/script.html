{{ $mainJS := resources.Get "js/main.js" }}

{{ if $mainJS }}
  {{ if hugo.IsProduction }}
    {{ $mainJS = $mainJS | minify | fingerprint }}
  {{ end }}

  <script src="{{ $mainJS.RelPermalink }}" {{ if hugo.IsProduction }}integrity="{{ $mainJS.Data.Integrity }}"{{ end }} defer></script>
{{ end }}

{{/*  Lenis  */}}
{{ $lenisJS := resources.Get "js/lenis.min.js" }}
<script src="{{ $lenisJS.RelPermalink }}"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const lenis = new Lenis({
      duration: 0.5,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      direction: 'vertical',
      gestureDirection: 'vertical',
      smooth: true,
      mouseMultiplier: 1,
      smoothTouch: false,
      touchMultiplier: 2,
      infinite: false,
    });

    window.lenis = lenis;

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }

    requestAnimationFrame(raf);
  });
</script>
