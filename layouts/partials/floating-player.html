<div id="floating-player" class="fixed top-8 left-1/2 transform -translate-x-1/2 -translate-y-[200%] opacity-0 transition-all duration-600 ease-[cubic-bezier(0.2,0.8,0.2,1)] z-100 w-[90%] max-w-sm md:max-w-lg">
  
  <div class="bg-[#f9f9f9]/95 backdrop-blur-xl border-[0.5px] border-color-black/10 shadow-[0_7px_10px_rgba(0,0,0,0.1)] rounded-xs px-5 py-3.5 flex items-center gap-5 w-full font-primary">
    
    {{/*  播放控制  */}}
    <div class="flex items-center gap-3 text-color-black shrink-0">
      <button id="player-prev" class="hover:text-color-red transition-colors focus:outline-none cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button id="player-play-pause" class="hover:text-color-red transition-colors w-6 h-6 flex items-center justify-center focus:outline-none cursor-pointer">
        <svg id="player-icon-play" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="player-icon-pause" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <button id="player-next" class="hover:text-color-red transition-colors focus:outline-none cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    
    {{/*  标题 & 进度条  */}}
    <div class="flex flex-col flex-1 gap-1.5 overflow-hidden">
      <div class="flex justify-between items-center text-[9px] font-mono tracking-widest w-full">     
        <div id="player-title-wrapper" class="overflow-hidden flex-1 mr-4 relative mask-[linear-gradient(to_right,black_85%,transparent_100%)] select-none">
          <span id="player-title" class="inline-block whitespace-nowrap text-color-black/80">
            Loading...
          </span>
        </div>
        <span id="player-time" class="text-color-black/40 shrink-0 select-none">
          0:00 / 0:00
        </span>
      </div>

      <div class="relative w-full py-1 cursor-pointer group" id="player-progress-container">
        <div class="absolute top-1/2 -translate-y-1/2 left-0 w-full h-[1.5px] bg-color-black/10 pointer-events-none"></div>
        <div id="player-progress-bar" class="absolute top-1/2 -translate-y-1/2 left-0 h-[1.5px] bg-color-red w-0 pointer-events-none transition-all duration-75"></div>
      </div>
    </div>

    {{/*  音量控制  */}}
    <div class="hidden md:flex items-center gap-2 shrink-0 ml-1">
      <button id="player-volume-icon" class="text-color-black hover:text-color-red transition-colors focus:outline-none flex items-center justify-center cursor-pointer">
        
        {{/*  通常  */}}
        <svg id="vol-icon-on" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        
        {{/*  静音  */}}
        <svg id="vol-icon-off" class="w-3.5 h-3.5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>

      </button>
      
      <div class="relative w-12 py-2 cursor-pointer group" id="player-volume-container">
        <div class="absolute top-1/2 -translate-y-1/2 left-0 w-full h-[1.5px] bg-color-black/10 pointer-events-none"></div>
        <div id="player-volume-progress" class="absolute top-1/2 -translate-y-1/2 left-0 h-[1.5px] bg-color-black w-[50%] pointer-events-none transition-all duration-75"></div>
      </div>
    </div>
    
    {{/*  关闭  */}}
    <button id="player-close" class="text-color-black/30 hover:text-color-red transition-colors shrink-0 ml-1 focus:outline-none cursor-pointer">
      <svg class="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>

  </div>
</div>
