baseURL = "https://aspr-works.top/"
title = "nova+z's sounds & logs"
languageCode = "zh-CN"
timeZone = "Asia/Shanghai"
enableRobotsTXT = true

[params]
  description = "nova+z's sounds & logs — The official website of Astral Parade, an independent project by nova+z featuring original music and blog posts."
  email = "novaxz@aspr-works.top"
  social = [
    "https://x.com/novaxz_nobasu",
    "https://soundcloud.com/novaxz_aspr",
    "https://novaxz.bandcamp.com/",
    "https://www.youtube.com/@novaxz_aspr",
    "https://space.bilibili.com/31785876",
    "https://music.163.com/#/artist?id=52170515",
  ]

  [params.twikoo]
    enable = true
    envId = "https://comment.aspr-works.top"
    region = ""

  rssFullContent = false  # 设为 true 则在 RSS 中输出全文内容

[services]
  [services.rss]
    limit = 20

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[build]
  [build.buildStats]
    enable = true

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10

  [[menu.main]]
    name = "Discography"
    url = "/discography/"
    weight = 20

  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 30

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 40

[taxonomies]
  category = "category"
  year = "year"
  tag = "tag"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    tabWidth = 4