{{ $mainJS := resources.Get "js/main.js" }}

{{ if $mainJS }}
  {{ if hugo.IsProduction }}
    {{ $mainJS = $mainJS | minify | fingerprint }}
  {{ end }}

  <script src="{{ $mainJS.RelPermalink }}" {{ if hugo.IsProduction }}integrity="{{ $mainJS.Data.Integrity }}"{{ end }} defer></script>
{{ end }}

{{/*  Lenis  */}}
{{ $lenisJS := resources.Get "js/lenis.min.js" }}
<script src="{{ $lenisJS.RelPermalink }}" defer></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const lenis = new Lenis({
      duration: 0.5,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      direction: 'vertical',
      gestureDirection: 'vertical',
      smooth: true,
      mouseMultiplier: 1,
      smoothTouch: false,
      touchMultiplier: 2,
      infinite: false,
    });

    window.lenis = lenis;

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }

    requestAnimationFrame(raf);
  });
</script>

{{/*  Mermaid  */}}
<script>
  // 测试开关
  var MERMAID_FALLBACK_TEST = false;

  document.addEventListener('DOMContentLoaded', function() {
    var mermaidElements = document.querySelectorAll('.mermaid');

    if (mermaidElements.length > 0) {
      var wrapperRefs = [];
      mermaidElements.forEach(function(el) {
        var w = el.closest('.mermaid-wrapper');
        if (w) wrapperRefs.push(w);
      });

      // TEST (/?mfallback=true/false/)
      if (MERMAID_FALLBACK_TEST) {
        var mf = (location.search.match(/[?&]mfallback=(true|false)\b/) || [])[1];
        if (mf === 'true') { fallbackNow(wrapperRefs); return; }
        if (mf === 'false') { return; }
      }

      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';

      script.onload = async function() {
        try {
          mermaid.initialize({ startOnLoad: false, theme: 'default' });
          await mermaid.run({ nodes: mermaidElements });
        } catch (e) {
          fallbackNow(wrapperRefs);
        }
      };

      script.onerror = function() {
        fallbackNow(wrapperRefs);
      };

      document.body.appendChild(script);
    }
  });

  function fallbackNow(wrappers) {
    wrappers.forEach(function(wrapper) {
      var fb = wrapper.querySelector('.mermaid-fallback-js');
      if (fb) {
        wrapper.innerHTML = fb.outerHTML;
        var el = wrapper.firstElementChild;
        if (el) el.classList.remove('mermaid-fallback-js');
      }
    });
  }
</script>
