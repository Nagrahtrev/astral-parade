{{ define "main" }}

  <section class="max-w-3xl mx-auto px-5 py-12">

    <h1 class="text-4xl font-bold mb-10">{{ .Title }}</h1>

    <div class="text-color-white mb-10">
      {{ .Content }}
    </div>

    <ul class="space-y-4">
      {{ range .Pages }}
        <li class="border-b border-color-black pb-5">
          <a href="{{ .Permalink }}" class="text-xl text-color-white">
            {{ .Title }}
          </a>
        </li>
      {{ end }}
    </ul>

  </section>

{{ end }}
