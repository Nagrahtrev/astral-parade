<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>有人回复了您的评论</title>
</head>
<body style="margin:0;padding:40px 0;background:#eeeeee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto">
  <tr>
    <td style="background:#eeeeee;padding:40px 36px;border:1px solid #020203">

      <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:0.07em;color:#878787">
        ${SITE_NAME}
      </p>
      <p style="margin:0 0 28px;font-size:17px;font-weight:500;line-height:2.4;color:#020203">
        有人回复了您的评论
      </p>

      <p style="margin:0 0 12px;font-size:14px;line-height:1.6;color:#6a6a6a">
        <strong style="color:#020203">${NICK}</strong>&nbsp;回复：
      </p>

      <table width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px">
        <tr>
          <td style="background:#e3e3e3;padding:16px 20px;border-left:3px solid #020203;font-size:14px;line-height:1.7;color:#333">
            ${COMMENT}
          </td>
        </tr>
      </table>

      <table cellpadding="0" cellspacing="0" style="margin:0 0 40px">
        <tr>
          <td style="background:#020203;padding:0">
            <a href="${POST_URL}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:12px 28px;font-size:13px;font-weight:700;color:#eeeeee;text-decoration:none;letter-spacing:0.06em">查看评论</a>
          </td>
        </tr>
      </table>

      <hr style="border:none;border-top:1px solid #cdcdcd;margin:0 0 10px">

      <p style="margin:0;font-size:11px;line-height:1.6;color:#a9a9a9">
        此邮件由系统自动发出，请勿直接回复。<br>
        邮箱为选填项，仅用于接收评论回复通知。无需通知请留空。
      </p>

    </td>
  </tr>
</table>
</body>
</html>
